<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Podcast microphone">
  <!--
    Monochrome microphone mark used as the podcast artwork fallback.
    Painted in a single colour so the application can tint it from the theme via CSS mask;
    the grille is cut out of the capsule so the shape still reads at 40px.
  -->
  <mask id="podcast-grille">
    <rect width="64" height="64" fill="#fff" />
    <g stroke="#000" stroke-width="2.6" stroke-linecap="round">
      <path d="M27 19h10" />
      <path d="M27 24h10" />
      <path d="M27 29h10" />
    </g>
  </mask>

  <g fill="#000">
    <rect x="23" y="9" width="18" height="30" rx="9" mask="url(#podcast-grille)" />
    <path
      d="M18 30v3c0 7.7 6.3 14 14 14s14-6.3 14-14v-3"
      fill="none"
      stroke="#000"
      stroke-width="4"
      stroke-linecap="round"
    />
    <path d="M32 47v8" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" />
    <path d="M23 56.5h18" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round" />
  </g>
</svg>
